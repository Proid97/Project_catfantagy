<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/app-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="냥국배틀" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#103d42" />
    <meta name="description" content="주사위와 카드로 펼치는 판타지 고양이들의 대결, 운빨냥국배틀." />
    <title>운빨냥국배틀</title>
  </head>
  <body>
    <main id="app" aria-label="운빨냥국배틀">
      <div class="stage" data-state="loading" aria-busy="true">
        <div class="art" aria-hidden="true"></div>
        <h1 class="sr-only">운빨냥국배틀</h1>
        <button class="start" hidden aria-label="게임 시작">TOUCH TO START</button>
        <p class="status" role="status">냥국을 불러오는 중…</p>
        <button class="skip" hidden>연출 건너뛰기</button>
        <button class="retry" hidden>다시 불러오기</button>
        <button class="replay" hidden aria-label="타이틀 연출 다시 보기">연출 다시 보기 <span aria-hidden="true">↻</span><span class="motion-note" hidden role="status">자동 연출: 동작 줄이기</span></button>
      </div>
      <section id="setup" class="setup-screen" hidden aria-labelledby="setup-title"></section>
    </main>
    <noscript>게임을 시작하려면 자바스크립트를 켜주세요.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
